    <script type="module">
      import { PROJECTS_DATA } from './projects-data.js';

      const GOOGLE_SHEETS_API_URL = 'https://script.google.com/macros/s/AKfycbypkMwhAcNh1Mas_Jevf8mJoVeZOsHYfwllHHKR8PQWi-Cfd7-dnv0jtlSQGYxsxZb8/exec';

      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function showToast(message) {
        const container = document.getElementById('toastContainer');
        if (!container) return;
        const toast = document.createElement('div');
        toast.className = 'tark-toast';
        toast.innerHTML = `<span>✓</span> <span>${escapeHtml(message)}</span>`;
        container.appendChild(toast);
        setTimeout(() => toast.classList.add('show'), 10);
        setTimeout(() => {
          toast.classList.remove('show');
          setTimeout(() => toast.remove(), 250);
        }, 3200);
      }
      window.showToast = showToast;

      function getProjectIcon(idOrItem) {
        const id = ((typeof idOrItem === 'string' ? idOrItem : (idOrItem && idOrItem.id)) || '').toLowerCase().trim();
        
        // Bagh-Chal Ancient Board Game
        if (id === 'bagh-chal' || id === 'baghchal' || id.includes('bagh') || id.includes('chal') || id.includes('tiger')) {
          return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 2rem; height: 2rem; color: #34d399;"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/><line x1="3" y1="3" x2="21" y2="21"/><line x1="21" y1="3" x2="3" y2="21"/></svg>`;
        }
        if (id === 'storeready') {
          return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 2rem; height: 2rem; color: #2dd4bf;"><path d="m16.5 9.4-9-5.19M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" y1="22" x2="12" y2="12"/></svg>`;
        }
        if (id === 'flashdrop') {
          return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 2rem; height: 2rem; color: #fbbf24;"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`;
        }
        if (id === 'chota-hathi') {
          return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 2rem; height: 2rem; color: #38bdf8;"><rect width="20" height="12" x="2" y="6" rx="6"/><line x1="6" x2="10" y1="12" y2="12"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="15" x2="15.01" y1="13" y2="13"/><line x1="18" x2="18.01" y1="11" y2="11"/></svg>`;
        }
        if (id === 'mental-math-academy') {
          return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 2rem; height: 2rem; color: #c084fc;"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>`;
        }
        if (id === 'apex-monitor') {
          return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 2rem; height: 2rem; color: #22d3ee;"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.48 12H2"/></svg>`;
        }
        if (id === 'omni-relay-client') {
          return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 2rem; height: 2rem; color: #818cf8;"><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></svg>`;
        }
        if (id === 'tark-vault-sync') {
          return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 2rem; height: 2rem; color: #fb7185;"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><rect width="8" height="5" x="8" y="11" rx="1"/><path d="M10 11V9a2 2 0 1 1 4 0v2"/></svg>`;
        }
        return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 2rem; height: 2rem; color: #2dd4bf;"><circle cx="12" cy="12" r="10"/><polygon points="12 6 12 12 16 14"/></svg>`;
      }

      function normalizeItem(item) {
        if (!item || typeof item !== 'object') return null;

        const rawTitle = (item.title ?? item.name ?? '').toString().trim();
        const rawId = (item.id ?? '').toString().trim().toLowerCase();

        // Strict Guard: Reject blank, trailing, or unpopulated rows from Google Sheets
        if (!rawTitle && !rawId) {
          return null;
        }

        const title = rawTitle || rawId.replace(/[-_]+/g, ' ').trim();
        if (!title) {
          return null;
        }

        const id = rawId || title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

        const rawStatus = (item.status ?? '').toString().trim().toLowerCase();
        if (rawStatus === 'inactive' || rawStatus === 'hidden' || rawStatus === 'archived' || rawStatus === 'deleted') {
          return null;
        }

        // Custom action Button 1 inputs: btn1_text and webUrl
        let btn1_text = (item.btn1_text ?? item.btn1Text ?? item.btn_text ?? '').toString().trim();
        let webUrl = (item.webUrl ?? item.web_url ?? item.website_url ?? '').toString().trim();

        // Distribution action Button 2 inputs: apk_url, indus_url, playstore_url
        let apk_url = (item.apk_url ?? item.apkUrl ?? item.apk ?? '').toString().trim();
        let indus_url = (item.indus_url ?? item.indusUrl ?? item.indus ?? '').toString().trim();
        let playstore_url = (item.playstore_url ?? item.playstoreUrl ?? item.play_store_url ?? item.playStoreUrl ?? '').toString().trim();

        // Local fallback mapping if URLs were empty
        if (!apk_url && !indus_url && !playstore_url && !webUrl) {
          if (id === 'bagh-chal' || id === 'baghchal') {
            apk_url = 'downloads/baghchal-release.apk';
            webUrl = 'games/bagh-chal/index.html';
            btn1_text = btn1_text || 'Play Online';
            indus_url = 'https://www.indusappstore.com/apps/com.tarkstudio.baghchal';
            playstore_url = 'https://play.google.com/store/apps/details?id=com.tarkstudio.baghchal';
          } else if (id === 'flashdrop') {
            apk_url = 'downloads/flashdrop-release.apk';
          } else if (id === 'chota-hathi') {
            apk_url = 'downloads/chotahathi-release.apk';
            indus_url = 'https://www.indusappstore.com/apps/com.tarkstudio.chotahathi';
          } else if (id === 'mental-math-academy') {
            playstore_url = 'https://play.google.com/store/apps/details?id=com.tarkstudio.mentalmath';
          } else if (id === 'storeready') {
            webUrl = 'tools/storeready/index.html';
            btn1_text = btn1_text || 'Launch Suite';
          } else if (id === 'apex-monitor') {
            webUrl = 'https://apex.tarkstudio.dev';
            btn1_text = btn1_text || 'Open Console';
          } else if (id === 'omni-relay-client') {
            indus_url = 'https://www.indusappstore.com/apps/com.tarkstudio.omnirelay';
          }
        }

        const shortDesc = (item.short_desc || item.shortDesc || item.description || '').toString().trim();

        return {
          id: id,
          title: title,
          version: (item.version || 'v1.0.0').toString().trim(),
          mode: (item.mode || 'offline').toString().trim().toLowerCase(),
          type: (item.type || 'apk').toString().trim().toLowerCase(),
          status: rawStatus || 'active',
          category: (item.category || (item.type === 'apk' ? 'Android Utility' : 'Web Application')).toString().trim(),
          description: (item.description || shortDesc).toString().trim(),
          short_desc: shortDesc,
          badge: (item.badge || '').toString().trim(),
          size: (item.size || (item.type === 'apk' ? 'APK Package' : 'Web App')).toString().trim(),
          btn1_text: btn1_text,
          webUrl: webUrl,
          apk_url: apk_url,
          apkUrl: apk_url, // backwards compatibility
          indus_url: indus_url,
          playstore_url: playstore_url
        };
      }

      /**
       * Render hybrid action buttons on the product detail header
       */
      function renderDetailActionButtons(item) {
        const isLocked = item.status === 'locked';

        if (isLocked) {
          return `
            <button class="action-btn btn-locked" disabled style="opacity: 0.6; cursor: not-allowed; padding: 0.55rem 1.25rem; font-size: 0.8125rem; width: auto; min-width: 200px;">
              <span>🔒 Private Staging - Coming Soon</span>
            </button>
          `;
        }

        // 1. Button 1 (Custom Action - Manual)
        const hasButton1 = Boolean(item.btn1_text && String(item.btn1_text).trim() && item.webUrl && String(item.webUrl).trim());
        let button1Markup = '';
        if (hasButton1) {
          const rawLabel = String(item.btn1_text).trim();
          button1Markup = `
            <a 
              href="${escapeHtml(item.webUrl)}" 
              class="action-btn btn-custom-action" 
              target="_blank" 
              rel="noopener noreferrer"
              data-detail-custom="${escapeHtml(item.title)}"
              style="padding: 0.6rem 1.35rem; font-size: 0.875rem; width: auto; flex: 1 1 200px; max-width: 280px; justify-content: center;"
            >
              <span class="btn-text-content">${escapeHtml(rawLabel)} ↗</span>
            </a>
          `;
        }

        // 2. Button 2 (Distribution Action - Fully Automatic)
        const distOptions = [];
        const apk = (item.apk_url || item.apkUrl || '').trim();
        const indus = (item.indus_url || item.indusUrl || '').trim();
        const play = (item.playstore_url || item.playstoreUrl || '').trim();

        if (apk) {
          distOptions.push({
            type: 'apk',
            label: 'Direct APK',
            title: 'Direct APK Download',
            url: apk,
            isDownload: true
          });
        }
        if (indus) {
          distOptions.push({
            type: 'indus',
            label: 'Indus Appstore',
            title: 'Indus Appstore',
            url: indus,
            isDownload: false
          });
        }
        if (play) {
          distOptions.push({
            type: 'playstore',
            label: 'Play Store',
            title: 'Google Play Store',
            url: play,
            isDownload: false
          });
        }

        let button2Markup = '';
        if (distOptions.length === 1) {
          const opt = distOptions[0];
          if (opt.type === 'apk') {
            const fileName = opt.url.split('/').pop() || `${item.id}-release.apk`;
            button2Markup = `
              <a 
                href="${escapeHtml(opt.url)}" 
                class="action-btn btn-distribution btn-apk-download" 
                download="${escapeHtml(fileName)}"
                data-detail-apk="${escapeHtml(item.title)}"
                data-url="${escapeHtml(opt.url)}"
                style="padding: 0.6rem 1.35rem; font-size: 0.875rem; width: auto; flex: 1 1 200px; max-width: 280px; justify-content: center;"
              >
                <span class="btn-text-content">⬇ Direct APK (${escapeHtml(item.size || 'Release')})</span>
              </a>
            `;
          } else if (opt.type === 'indus') {
            button2Markup = `
              <a 
                href="${escapeHtml(opt.url)}" 
                class="action-btn btn-distribution btn-indus-store" 
                target="_blank" 
                rel="noopener noreferrer"
                data-detail-indus="${escapeHtml(item.title)}"
                style="padding: 0.6rem 1.35rem; font-size: 0.875rem; width: auto; flex: 1 1 200px; max-width: 280px; justify-content: center;"
              >
                <span class="btn-text-content">Indus Appstore ↗</span>
              </a>
            `;
          } else if (opt.type === 'playstore') {
            button2Markup = `
              <a 
                href="${escapeHtml(opt.url)}" 
                class="action-btn btn-distribution btn-play-store" 
                target="_blank" 
                rel="noopener noreferrer"
                data-detail-play="${escapeHtml(item.title)}"
                style="padding: 0.6rem 1.35rem; font-size: 0.875rem; width: auto; flex: 1 1 200px; max-width: 280px; justify-content: center;"
              >
                <span class="btn-text-content">Google Play Store ↗</span>
              </a>
            `;
          }
        } else if (distOptions.length > 1) {
          button2Markup = `
            <button 
              type="button" 
              class="action-btn btn-distribution btn-store-dropdown"
              id="detailStoreDropdownBtn"
              style="padding: 0.6rem 1.35rem; font-size: 0.875rem; width: auto; flex: 1 1 200px; max-width: 280px; justify-content: center;"
            >
              <span class="btn-text-content">Official Store ▾</span>
            </button>
          `;
        }

        if (button1Markup && button2Markup) {
          return `<div style="display: flex; flex-wrap: wrap; gap: 0.625rem; width: 100%; align-items: center;">${button1Markup}${button2Markup}</div>`;
        } else if (button1Markup) {
          return `<div style="display: flex; flex-wrap: wrap; gap: 0.625rem; width: 100%; align-items: center;">${button1Markup}</div>`;
        } else if (button2Markup) {
          return `<div style="display: flex; flex-wrap: wrap; gap: 0.625rem; width: 100%; align-items: center;">${button2Markup}</div>`;
        } else {
          return '';
        }
      }

      /**
       * Distribution modal for detail page
       */
      function openDetailDistributionModal(item) {
        if (!item) return;

        const options = [];
        const apk = (item.apk_url || item.apkUrl || '').trim();
        const indus = (item.indus_url || item.indusUrl || '').trim();
        const play = (item.playstore_url || item.playstoreUrl || '').trim();

        if (apk) {
          const fileName = apk.split('/').pop() || `${item.id}-release.apk`;
          options.push({
            type: 'apk',
            title: 'Direct APK Download',
            description: 'Air-gapped Android package file (.apk)',
            badge: 'Direct Download ⬇',
            url: apk,
            isDownload: true,
            fileName: fileName,
            iconSvg: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`,
            themeClass: 'modal-opt-apk'
          });
        }

        if (indus) {
          options.push({
            type: 'indus',
            title: 'Indus Appstore',
            description: 'Official release on Made-in-India Android marketplace',
            badge: 'Indus Store ↗',
            url: indus,
            isDownload: false,
            iconSvg: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m9 12 2 2 4-4"/></svg>`,
            themeClass: 'modal-opt-indus'
          });
        }

        if (play) {
          options.push({
            type: 'playstore',
            title: 'Google Play Store',
            description: 'Verified release scanned by Google Play Protect',
            badge: 'Google Play ↗',
            url: play,
            isDownload: false,
            iconSvg: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>`,
            themeClass: 'modal-opt-play'
          });
        }

        if (options.length === 0) return;

        closeDetailDistributionModal();

        const backdrop = document.createElement('div');
        backdrop.id = 'detailStoreDistributionModal';
        backdrop.className = 'store-modal-backdrop';
        backdrop.setAttribute('role', 'dialog');
        backdrop.setAttribute('aria-modal', 'true');

        backdrop.innerHTML = `
          <div class="store-modal-card">
            <div class="store-modal-header">
              <div class="store-modal-header-text">
                <div class="store-modal-kicker">OFFICIAL DISTRIBUTION CHANNELS</div>
                <h3 class="store-modal-title">${escapeHtml(item.title)}</h3>
                <p class="store-modal-sub">${escapeHtml(item.version)} • ${escapeHtml(item.category)}</p>
              </div>
              <button type="button" class="store-modal-close" id="detailDistModalCloseBtn" aria-label="Close distribution options">✕</button>
            </div>

            <div class="store-modal-body">
              <div class="store-modal-prompt">Choose an official store or direct distribution channel:</div>
              <div class="store-modal-options-list">
                ${options.map(opt => `
                  <a 
                    href="${escapeHtml(opt.url)}" 
                    class="store-option-item ${opt.themeClass}"
                    ${opt.isDownload ? `download="${escapeHtml(opt.fileName)}"` : 'target="_blank" rel="noopener noreferrer"'}
                    data-modal-action="${opt.type}"
                  >
                    <div class="store-option-icon-box">
                      ${opt.iconSvg}
                    </div>
                    <div class="store-option-meta">
                      <div class="store-option-heading">
                        <span class="store-option-name">${escapeHtml(opt.title)}</span>
                        <span class="store-option-tag">${escapeHtml(opt.badge)}</span>
                      </div>
                      <div class="store-option-desc">${escapeHtml(opt.description)}</div>
                    </div>
                  </a>
                `).join('')}
              </div>
            </div>

            <div class="store-modal-footer">
              <div class="store-modal-guarantee">
                <span>🛡️ Verified zero-telemetry software build by TarkStudio</span>
              </div>
              <button type="button" class="store-modal-cancel-btn" id="detailDistModalCancelBtn">Close</button>
            </div>
          </div>
        `;

        document.body.appendChild(backdrop);

        const close = () => closeDetailDistributionModal();
        document.getElementById('detailDistModalCloseBtn')?.addEventListener('click', close);
        document.getElementById('detailDistModalCancelBtn')?.addEventListener('click', close);

      /**
       * Dynamically inject production-grade SEO, Open Graph & Schema.org JSON-LD
       */
      function applyProductSEO(product) {
        if (!product) return;

        // 1. Dynamically update document.title
        const dynamicTitle = `${product.title} - Download APK & Play Online | TarkStudio`;
        document.title = dynamicTitle;
        const pageTitleEl = document.getElementById('pageTitle');
        if (pageTitleEl) pageTitleEl.textContent = dynamicTitle;

        // 2. Dynamically update the meta description
        const metaDescContent = `Download ${product.title} (${product.version}). ${product.short_desc} Free, privacy-first, direct download.`;
        let metaDesc = document.querySelector('meta[name="description"]');
        if (!metaDesc) {
          metaDesc = document.createElement('meta');
          metaDesc.name = 'description';
          document.head.appendChild(metaDesc);
        }
        metaDesc.setAttribute('content', metaDescContent);

        // 3. Social Media & Open Graph tags
        const pageUrl = `https://brijeshdhiman137-eng.github.io/TarkStudio/detail.html?id=${encodeURIComponent(product.id)}`;
        
        function setMeta(attr, key, val) {
          let el = document.querySelector(`meta[${attr}="${key}"]`);
          if (!el) {
            el = document.createElement('meta');
            el.setAttribute(attr, key);
            document.head.appendChild(el);
          }
          el.setAttribute('content', val);
        }

        setMeta('property', 'og:title', dynamicTitle);
        setMeta('property', 'og:description', metaDescContent);
        setMeta('property', 'og:url', pageUrl);
        setMeta('property', 'og:type', 'website');
        setMeta('property', 'og:image', './assets/og-banner.png');

        setMeta('property', 'twitter:title', dynamicTitle);
        setMeta('property', 'twitter:description', metaDescContent);
        setMeta('property', 'twitter:url', pageUrl);
        setMeta('property', 'twitter:image', './assets/og-banner.png');

        const canonical = document.getElementById('canonicalTag');
        if (canonical) canonical.setAttribute('href', pageUrl);

        // 4. Inject Schema.org JSON-LD structured data dynamically into the head
        let schemaScript = document.getElementById('schema-jsonld');
        if (!schemaScript) {
          schemaScript = document.createElement('script');
          schemaScript.id = 'schema-jsonld';
          schemaScript.type = 'application/ld+json';
          document.head.appendChild(schemaScript);
        }
        const schemaData = {
          "@context": "https://schema.org",
          "@type": "SoftwareApplication",
          "name": product.title,
          "operatingSystem": "ANDROID, WEB",
          "applicationCategory": product.category,
          "softwareVersion": product.version,
          "description": product.short_desc,
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "INR"
          }
        };
        schemaScript.textContent = JSON.stringify(schemaData, null, 2);
      }

      /**
       * Fetch live catalog from Google Sheets API with fallbacks
       */
      async function loadCatalog() {
        try {
          const res = await fetch(`${GOOGLE_SHEETS_API_URL}?tab=Apps`, { cache: 'no-cache' });
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) {
              return data.map(normalizeItem).filter(Boolean);
            }
          }
        } catch (e) {
          console.warn('Live Google Sheets Apps fetch error, checking fallbacks:', e);
        }

        try {
          const res2 = await fetch('./apps.json');
          if (res2.ok) {
            const data2 = await res2.json();
            if (Array.isArray(data2) && data2.length > 0) return data2.map(normalizeItem).filter(Boolean);
          }
        } catch (e) {}

        try {
          const res3 = await fetch('./products.json');
          if (res3.ok) {
            const data3 = await res3.json();
            if (Array.isArray(data3) && data3.length > 0) return data3.map(normalizeItem).filter(Boolean);
          }
        } catch (e) {}

        if (typeof PROJECTS_DATA !== 'undefined' && Array.isArray(PROJECTS_DATA) && PROJECTS_DATA.length > 0) {
          return PROJECTS_DATA.map(normalizeItem).filter(Boolean);
        }

        return [];
      }

      /**
       * Fetch live reviews from Google Sheets API
       */
      async function loadReviews() {
        try {
          const res = await fetch(`${GOOGLE_SHEETS_API_URL}?tab=Reviews`, { cache: 'no-cache' });
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data)) return data;
          }
        } catch (e) {
          console.warn('Google Sheets Reviews fetch notice:', e);
        }
        return [];
      }

      function renderStarsHtml(rating) {
        const score = Math.round(Number(rating) || 5);

        for (let i = 1; i <= 5; i++) {

          } else {
            html += `<span style="color: rgba(255,255,255,0.15); font-size: 1rem;">☆</span>`;
          }
        }
        return html;
      }

            <div id="reviewsList" style="display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem;">
              ${allProductReviews.length === 0 ? `
                <div style="text-align: center; padding: 2rem 1rem; background: rgba(255, 255, 255, 0.02); border: 1px dashed rgba(255, 255, 255, 0.08); border-radius: 10px;">
                  <div style="font-size: 1.5rem; margin-bottom: 0.35rem;">💬</div>
                  <p style="color: #94a3b8; font-size: 0.875rem; margin-bottom: 0.25rem;">No reviews submitted yet for this application.</p>
                  <p style="color: #64748b; font-size: 0.75rem;">Be the first to share your experience below!</p>
                </div>
              ` : allProductReviews.map(r => `
                <div style="padding: 0.875rem 1rem; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 10px;">
                  <div style="display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.4rem;">
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                      <div style="width: 1.75rem; height: 1.75rem; border-radius: 9999px; background: #0284c7; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700;">
                        ${escapeHtml((r.userName || 'U').charAt(0).toUpperCase())}
                      </div>
                      <span style="font-size: 0.8125rem; font-weight: 600; color: #f8fafc;">${escapeHtml(r.userName || 'Verified User')}</span>
                    </div>
                    <div>
                      ${renderStarsHtml(r.rating || 5)}
                    </div>
                  </div>
                  <p style="color: #cbd5e1; font-size: 0.8125rem; line-height: 1.5; margin-left: 2.25rem;">
                    ${escapeHtml(r.comment || 'No written feedback.')}
                  </p>
                  ${r.timestamp ? `
                    <div style="margin-left: 2.25rem; margin-top: 0.35rem; font-size: 0.7rem; color: #64748b;">
                      ${new Date(r.timestamp).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' })}
                    </div>
                  ` : ''}
                </div>
              `).join('')}
            </div>

            <!-- Review Submission Form -->
            <div style="padding: 1.25rem; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px;">
              <h3 style="font-size: 0.9375rem; font-weight: 700; color: #f8fafc; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.4rem;">
                <span>✍️ Submit a Review</span>
              </h3>
              
              <form id="addReviewForm" style="display: flex; flex-direction: column; gap: 0.75rem;">
                <div style="display: flex; flex-wrap: wrap; gap: 0.75rem;">
                  <div style="flex: 1 1 200px;">
                    <label style="display: block; font-size: 0.75rem; color: #94a3b8; margin-bottom: 0.25rem;">Your Name</label>
                    <input 
                      type="text" 
                      id="reviewAuthor" 
                      placeholder="e.g. Anand S." 
                      required 
                      style="width: 100%; background: #07090e; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 0.5rem 0.75rem; font-size: 0.8125rem; color: #f8fafc;"
                    />
                  </div>
                  <div style="flex: 0 1 160px;">
                    <label style="display: block; font-size: 0.75rem; color: #94a3b8; margin-bottom: 0.25rem;">Rating</label>
                    <select 
                      id="reviewRating" 
                      style="width: 100%; background: #07090e; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 0.5rem 0.75rem; font-size: 0.8125rem; color: #fbbf24;"
                    >
                      <option value="5">★★★★★ (5/5)</option>
                      <option value="4">★★★★☆ (4/5)</option>
                      <option value="3">★★★☆☆ (3/5)</option>
                      <option value="2">★★☆☆☆ (2/5)</option>
                      <option value="1">★☆☆☆☆ (1/5)</option>
                    </select>
                  </div>
                </div>

                <div>
                  <label style="display: block; font-size: 0.75rem; color: #94a3b8; margin-bottom: 0.25rem;">Feedback / Review Notes</label>
                  <textarea 
                    id="reviewComment" 
                    rows="2" 
                    placeholder="Share your experience with this software package..." 
                    required 
                    style="width: 100%; background: #07090e; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 0.5rem 0.75rem; font-size: 0.8125rem; color: #f8fafc; font-family: inherit; resize: vertical;"
                  ></textarea>
                </div>

                <div style="display: flex; justify-content: flex-end;">
                  <button 
                    type="submit" 
                    class="action-btn btn-web-open" 
                    style="width: auto; padding: 0.45rem 1.25rem; font-size: 0.8125rem;"
                  >
                    <span>Submit Review</span>
                  </button>
                </div>
              </form>
            </div>
          </div>
        `;

        // Wire Hybrid Action Button Listeners
        const detailDropdown = document.getElementById('detailStoreDropdownBtn');
        if (detailDropdown) {
          detailDropdown.addEventListener('click', (e) => {
            e.preventDefault();
            openDetailDistributionModal(item);
          });
        }

        container.querySelectorAll('[data-detail-custom]').forEach(btn => {
          btn.addEventListener('click', () => {
            showToast(`Opening ${item.title}...`);
          });
        });

        container.querySelectorAll('[data-detail-apk]').forEach(btn => {
          btn.addEventListener('click', () => {
            showToast(`Starting direct APK download: ${item.title}`);
          });
        });

        container.querySelectorAll('[data-detail-indus]').forEach(btn => {
          btn.addEventListener('click', () => {
            showToast(`Redirecting to Indus Appstore for ${item.title}...`);
          });
        });

        container.querySelectorAll('[data-detail-play]').forEach(btn => {
          btn.addEventListener('click', () => {
            showToast(`Redirecting to Google Play Store for ${item.title}...`);
          });
        });

        // Wire Review Form submission
        const reviewForm = document.getElementById('addReviewForm');
        if (reviewForm) {
          reviewForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const authorInput = document.getElementById('reviewAuthor');
            const ratingSelect = document.getElementById('reviewRating');
            const commentInput = document.getElementById('reviewComment');

            const author = (authorInput && authorInput.value.trim()) || 'Anonymous';
            const rating = Number(ratingSelect ? ratingSelect.value : 5);
            const comment = (commentInput && commentInput.value.trim()) || '';

            const newReview = {
              reviewId: `rev_${Date.now()}`,
              appId: item.id,
              userName: author,
              rating: rating,
              comment: comment,
              timestamp: new Date().toISOString(),
              status: 'approved'
            };

            // Save locally
            let cur = [];
            try {
              const prev = localStorage.getItem(`tark_reviews_${item.id}`);
              if (prev) cur = JSON.parse(prev);
            } catch (err) {}
            cur.unshift(newReview);
            try {
              localStorage.setItem(`tark_reviews_${item.id}`, JSON.stringify(cur));
            } catch (err) {}

            showToast('Review submitted successfully! Thank you for your feedback.');
            
            // Re-render detail page to reflect the new review
            setTimeout(() => {
              initDetail();
            }, 500);
          });
        }
      }

      // Initialize when DOM is loaded or immediately if already ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initDetail);
      } else {
        initDetail();
      }
    </script>
  </body>
</html>
